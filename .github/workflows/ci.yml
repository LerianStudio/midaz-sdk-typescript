name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Lint and Format
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint:check

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Type check tests
        run: npx tsc --project tsconfig.test.json --noEmit

  build-and-test:
    name: Build and Test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: lint-and-format
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Run tests with coverage
        if: matrix.node-version == '20.x'
        run: npm run test:coverage

      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Uncommitted changes detected!"
            git status
            exit 1
          fi

  security-audit:
    name: Security Audit
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: |
          # Two advisories are currently unfixable and are allowlisted below:
          # - GHSA-mh99-v99m-4gvg (brace-expansion): the fix (5.0.8+) is API-incompatible
          #   with minimatch@3 consumers (eslint/jest toolchains) and no patched 1.x/2.x
          #   backport exists.
          # - GHSA-r292-9mhp-454m (tar): only present inside npm's bundled dependencies
          #   (via semantic-release -> @semantic-release/npm -> npm); bundled deps cannot
          #   be overridden and no npm release ships the patched tar yet.
          # Remove these entries once upstream releases include the fixes.
          # The step still fails on any other advisory at moderate severity or above.
          ALLOWLIST='["GHSA-mh99-v99m-4gvg","GHSA-r292-9mhp-454m"]'
          npm audit --audit-level=moderate --json > /tmp/audit.json || true
          UNEXPECTED=$(jq -r --argjson allow "$ALLOWLIST" \
            '[.vulnerabilities[].via[]? | objects
              | select(.severity == "moderate" or .severity == "high" or .severity == "critical")
              | .url | split("/")[-1]] | unique - $allow | .[]' /tmp/audit.json)
          if [ -n "$UNEXPECTED" ]; then
            echo "Vulnerabilities found outside the allowlist:"
            echo "$UNEXPECTED"
            npm audit --audit-level=moderate || true
            exit 1
          fi
          echo "Security audit passed (allowlisted advisories only)."

      - name: Run CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  docs-build:
    name: Documentation Build
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build documentation
        run: npm run docs

      - name: Upload docs artifacts
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/
          retention-days: 7

  package-size:
    name: Package Size Analysis
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Analyze package size
        run: |
          echo "## Package Size Analysis" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          find dist/ -name "*.js" -exec du -sh {} \; | head -10 | while read size file; do
            echo "| $file | $size |" >> $GITHUB_STEP_SUMMARY
          done
